name: Publish

# Raising the version in package.json on main stages @voyager-crew/cli on npm.
# npm Trusted Publishing authenticates this workflow file through OIDC and may
# only stage: a maintainer approves the staged version with their second
# factor (npmjs.com → Staged Packages, or `npm stage approve`) before it goes
# live. The very first version is published by hand, since npm only trusts a
# workflow for a package that already exists.
on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Check npm for this version
        id: npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if OUTPUT=$(npm view "@voyager-crew/cli@${VERSION}" version 2>&1); then
            echo "@voyager-crew/cli@${VERSION} is already on npm"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif echo "${OUTPUT}" | grep -q 'E404'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            # A registry or network error is not "missing": fail instead of re-publishing.
            echo "${OUTPUT}" >&2
            exit 1
          fi

      - name: Setup Node
        if: steps.npm.outputs.publish == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        if: steps.npm.outputs.publish == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        if: steps.npm.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      # prepublishOnly runs verify and build. Staged publishing needs npm 11.15.0 or later.
      - name: Stage for approval
        if: steps.npm.outputs.publish == 'true'
        run: |
          npm install -g npm@^11.15.0
          npm stage publish --access public
